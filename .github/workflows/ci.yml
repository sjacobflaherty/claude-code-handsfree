name: CI

# A branch commit runs once, through its pull request; main runs on merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same ref cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE'

  check:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # macOS because the Swift helper (src/audiodev.swift) needs swiftc and CoreAudio,
    # src/disclaim.c needs clang and libSystem, and everything here is macOS-only anyway.
    runs-on: macos-latest
    # The run takes about 75 seconds; the suites poll a file, so a hung stub must not hold the runner for the 6 hour default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # Node 20 is the minimum src/setup.mjs accepts, so CI runs on it.
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the audio device helper
        run: npm run build

      - name: Lint
        run: npx biome check

      - name: Test
        run: npx vitest run
